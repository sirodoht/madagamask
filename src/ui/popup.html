<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Madagamask</title>
    <link rel="stylesheet" href="popup.css" />
    <script src="popup.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="brand-row">
        <a class="brand" href="popup.html" aria-label="Madagamask home"><span class="brand-mark" aria-hidden="true">m</span><span>madagamask</span></a>
        <button id="quick-lock" aria-label="Lock wallet" class="button button-secondary" type="button" hidden>Lock</button>
      </header>
      <p class="notice">Testnet alpha · Use test keys only.</p>
      <main id="app" class="stack" aria-busy="true"></main>
      <p id="status" class="status" role="status" aria-live="polite">Loading wallet…</p>
      <footer><button id="open-tab" class="button button-secondary" type="button">Open in a tab ↗</button></footer>
    </div>
  </body>
</html>
